resumen: >
  Prueba de concepto dentro del Proyecto Scheduler. Unifica y actualiza a la
  última versión de FreeBSD los trabajos previos del proyecto, y desarrolla un
  módulo que decide la planificación según la información que aportan los
  procesos en ejecución. Usa el pasaje de mensajes de espacio de usuario a
  kernel para interactuar con una red de Petri modificada y cambiar el
  comportamiento del scheduler de forma dinámica en un sistema multiprocesador
  simétrico. Incluye guías de configuración del entorno de trabajo.
