trabajo_futuro:
  - Levantar los límites de cantidad y tamaño de los datos (payloads) impuestos en la versión prototipo
  - Agregar a los parches del kernel funciones que modifiquen o seteen variables del kernel, para darle funcionalidad real al mecanismo
  - Extender el desarrollo a otros sistemas operativos, tomando como base el parche de FreeBSD
