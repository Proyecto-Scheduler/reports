titulo: "Comunicación desde espacio de usuario a espacio de kernel mediante metadatos en archivos ELF"
anio: 2022
integrantes:
  - José María Cancinos
  - Julián González
director: Maximiliano Andrés Eschoyez
codirector: Nicolás Papp
resumen: >
  Presenta un prototipo de mecanismo para que el programador envíe datos al
  kernel del sistema operativo insertándolos como metadatos en el ejecutable ELF
  durante la compilación. Al ejecutar el programa, el kernel detecta, extrae,
  decodifica y almacena esos datos. La implementación incluye herramientas
  complementarias para GCC y Clang/LLVM en espacio de usuario, y parches del
  kernel para FreeBSD 11, 12.3 y 13.
