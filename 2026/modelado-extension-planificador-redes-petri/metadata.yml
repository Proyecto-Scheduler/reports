trabajo_futuro:
  - Automatizar la activación y desactivación de los módulos con triggers dentro del sistema operativo, según la carga de trabajo
  - Vincular la inhibición de núcleos con la administración de energía de los procesadores modernos y evaluar si hay una reducción real del consumo
  - Ampliar la validación del encolado forzado (TRAN_ADDTOQUEUE_FORCED) con cargas más extensas, más combinaciones de afinidad y métricas de rendimiento
  - Estudiar políticas menos restrictivas para CPU0, hoy excluida de la inhibición y la monopolización, incluyendo un modo para sistemas con pocos núcleos
  - Optimizar el timeslice para procesadores inhibidos y para núcleos monopolizados
  - Representar dentro de la red de Petri las restricciones nativas de FreeBSD (afinidad, pinning, bounding, sched_bind) para reducir el uso del camino forzado
