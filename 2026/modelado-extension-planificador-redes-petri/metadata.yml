titulo: "Modelado y extensión de un planificador del sistema operativo mediante redes de Petri: integración de funcionalidades de monopolización de núcleos e inhibición de asignación de trabajo a procesadores"
anio: 2026
integrantes:
  - Leandro Agustín Drudi
