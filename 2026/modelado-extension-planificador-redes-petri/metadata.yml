director: Maximiliano Eschoyez
codirector: Nicolás Papp
resumen: >
  Parte del planificador de corto plazo de FreeBSD modelado con redes de Petri
  (Turina y Papp) y lo adapta de FreeBSD 11 a FreeBSD 13.1. Sobre esa base agrega
  dos módulos: uno de inhibición de asignación de trabajo, que impide que ciertos
  núcleos reciban hilos nuevos sin apagar el procesador, y otro de monopolización,
  que reserva un núcleo para un hilo específico. El primero se integra
  directamente en la red; el segundo necesita lógica auxiliar del kernel. También
  corrige una desincronización entre las colas de FreeBSD y el marcado de la red,
  con un camino de encolado forzado. El trabajo es funcional; no mide impacto en
  rendimiento ni en consumo energético. Según el README del repositorio, hoy la
  activación se hace con kernels de prueba y sysctl, y los módulos .ko quedaron
  deprecados.
estado: linea-abierta
repos:
