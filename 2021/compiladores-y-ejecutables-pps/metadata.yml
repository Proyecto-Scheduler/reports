resumen: >
  Informe de la Práctica Supervisada. Presenta los aspectos generales de los
  compiladores y del código intermedio, compara paso a paso GCC y CLANG/LLVM
  sobre un mismo programa en C (GIMPLE contra LLVM IR) y explica la estructura
  de los archivos ejecutables ELF. Finalmente, expone tres métodos para insertar
  datos (payload) en un ELF (sección .comment, sección .rodata y una sección
  nueva .metadata) y un programa propio que lee esos datos. Se eligió la sección
  nueva, con el payload pasado por línea de comandos al compilador. Los
  programas de inserción y lectura son la base del Proyecto Integrador de 2022.
